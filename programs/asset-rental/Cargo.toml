[package]
name = "asset-rental"
version = "0.1.0"
description = "Escrowed native-SOL rentals of physical assets for the Solana asset-rental marketplace POC"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "asset_rental"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
