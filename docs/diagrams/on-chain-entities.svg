oke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M851.809,287.86 L851.809,297.86 L861.809,297.86 L851.809,287.86" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="509.33" y="305.054" fill="#000" font-size="13" textLength="337.479">Singleton: admin, treasury, fee_bps, and the pause switch.</text><text x="509.33" y="320.003" fill="#000" font-size="13" textLength="292.646">Read for every settlement; no instruction accepts a</text><text x="509.33" y="334.951" fill="#000" font-size="13" textLength="172.682">treasury or fee from the client.</text></g><g class="entity" data-qualified-name="GMN10" id="ent0011" data-source-line="58"><path d="M607.53,606.71 L607.53,646.607 L961.604,646.607 L961.604,616.71 L951.604,606.71 L607.53,606.71" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M951.604,606.71 L951.604,616.71 L961.604,616.71 L951.604,606.71" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="613.53" y="623.904" fill="#000" font-size="13" textLength="333.074">One PDA per physical asset. Discovery fields are numeric</text><text x="613.53" y="638.853" fill="#000" font-size="13" textLength="317.23">(category) plus a metadata hash; no PII or coordinates.</text></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="63"><path d="M120.46,812.35 L120.46,867.196 A0,0 0 0 0 120.46,867.196 L458.671,867.196 A0,0 0 0 0 458.671,867.196 L458.671,822.35 L448.671,812.35 L293.57,812.35 L289.57,752.79 L285.57,812.35 L120.46,812.35 A0,0 0 0 0 120.46,812.35" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M448.671,812.35 L448.671,822.35 L458.671,822.35 L448.671,812.35" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="126.46" y="829.544" fill="#000" font-size="13" textLength="308.521">Durable escrow record created with `init`, so a reused</text><text x="126.46" y="844.493" fill="#000" font-size="13" textLength="285.435">rental_id fails account creation (the replay guard).</text>