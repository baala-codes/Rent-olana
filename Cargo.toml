[workspace]
members = ["programs/asset-rental"]
resolver = "2"

# Agave/Solana version used by the reproducible `solana-verify` build image.
# Keep this in step with scripts/install-toolchain.sh.
[workspace.metadata.cli]
solana = "1.18.26"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
